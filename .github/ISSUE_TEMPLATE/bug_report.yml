name: Bug report
description: Something in Guideway does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A small reproduction (a screen with one or two targets) gets a bug fixed much faster.
  - type: input
    id: guideway-version
    attributes:
      label: Guideway version
      placeholder: "0.4.1"
    validations:
      required: true
  - type: input
    id: rn-version
    attributes:
      label: React Native version (and Expo SDK, if you use Expo)
      placeholder: "react-native 0.85.3, Expo SDK 56"
    validations:
      required: true
  - type: input
    id: reanimated-version
    attributes:
      label: react-native-reanimated and react-native-svg versions
      placeholder: "reanimated 4.3.1, svg 15.15.4"
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options:
        - Expo Go
        - Expo development build / prebuild
        - Bare React Native
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms affected
      multiple: true
      options:
        - iOS
        - Android
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - New Architecture (default since React Native 0.76)
        - Old architecture
        - Not sure
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device or simulator, and OS version
      placeholder: "iPhone 17 Pro simulator, iOS 26 / Pixel 9 emulator, Android 15"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected, and what you saw instead. Screenshots or a screen recording help a lot for spotlight and tooltip position bugs.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest code that shows the problem, or a link to a repo.
      render: tsx
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any errors or warnings from Metro or the device log.
      render: shell
